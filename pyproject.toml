[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tau2-faults"
version = "0.1.0"
description = "Tool-fault injection for tau2-bench (lost responses, transient errors, stale reads) with replay-exact grading"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ankit Goel" }]
keywords = ["tau2-bench", "llm-agents", "fault-injection", "idempotency", "agent-evaluation", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Intended Audience :: Science/Research",
]
# tau2-bench is not on PyPI: install it from GitHub first (see README).
dependencies = []

[project.urls]
Homepage = "https://github.com/ankitgoelcmu/tau2-faults"
Paper = "https://github.com/ankitgoelcmu/faultline-agent"
Issues = "https://github.com/ankitgoelcmu/tau2-faults/issues"

[project.scripts]
tau2-faults = "tau2_faults:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tau2_faults"]
